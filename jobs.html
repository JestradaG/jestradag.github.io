<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juan Estrada — Operations Research Job Tracker</title>
    <style>
      :root { color-scheme: light; --ink: #172033; --muted: #627083; --line: #dce3ec; --accent: #0300cf; --surface: #fff; --wash: #f4f7fb; }
      * { box-sizing: border-box; } body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shell { max-width: 1080px; margin: 0 auto; padding: 28px 20px 56px; } .top { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
      .brand { color: var(--ink); font-size: 1.05rem; font-weight: 750; text-decoration: none; } .back { color: var(--accent); font-size: .92rem; font-weight: 650; text-decoration: none; } .back:hover, .job-title:hover { text-decoration: underline; }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px rgb(20 35 60 / 6%); padding: clamp(20px, 4vw, 42px); }
      .jobs-eyebrow { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .12em; margin: 0 0 .4rem; } h1 { font-size: clamp(1.65rem, 4vw, 2.35rem); letter-spacing: -.035em; line-height: 1.1; margin: 0; } .intro { color: var(--muted); margin: .8rem 0 0; max-width: 46rem; }
      .jobs-intro { align-items: end; display: flex; gap: 1rem; justify-content: space-between; } .jobs-download { background: var(--accent); border-radius: 7px; color: #fff; flex: none; font-size: .9rem; font-weight: 700; padding: .6rem .85rem; text-decoration: none; }
      .jobs-filters { display: grid; gap: .7rem; grid-template-columns: 2fr 1fr 1fr; margin-top: 1.75rem; } input, select { background: #fff; border: 1px solid #cbd5e1; border-radius: 7px; color: var(--ink); font: inherit; padding: .65rem .72rem; width: 100%; }
      .jobs-results-bar { align-items: center; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; margin-top: 1.25rem; padding-bottom: .65rem; } #jobs-count, .quiet { color: var(--muted); font-size: .9rem; }
      .job-card { border-bottom: 1px solid var(--line); padding: 1.1rem 0; } .job-card:last-child { border-bottom: 0; }.job-card-heading { align-items: flex-start; display: flex; gap: 1rem; justify-content: space-between; } .job-title { color: var(--ink); font-size: 1.05rem; font-weight: 750; line-height: 1.3; text-decoration: none; }
      .job-sector { border-radius: 999px; font-size: .76rem; font-weight: 750; padding: .2rem .55rem; white-space: nowrap; } .job-sector-academia { background: #edf0ff; color: #322ca7; } .job-sector-industry { background: #e7f7f0; color: #08764a; }
      .job-meta { color: var(--muted); display: flex; flex-wrap: wrap; font-size: .87rem; gap: .35rem 1rem; margin-top: .55rem; } .job-meta-item { white-space: nowrap; }
      #jobs-status.text-danger { color: #b42318; } footer { color: var(--muted); font-size: .82rem; margin-top: 20px; text-align: center; }
      @media (max-width: 680px) { .top, .jobs-intro, .job-card-heading { align-items: flex-start; flex-direction: column; } .jobs-filters { grid-template-columns: 1fr; } .jobs-download { width: 100%; text-align: center; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top"><a class="brand" href="https://websites.umich.edu/~juanest/">Juan Estrada</a><a class="back" href="https://websites.umich.edu/~juanest/">← Main website</a></header>
      <section class="panel">
        <div class="jobs-intro"><div><p class="jobs-eyebrow">CURATED OPPORTUNITIES</p><h1>Operations Research Job Tracker</h1><p class="intro">Current openings gathered from INFORMS. Select a title to view its original posting.</p></div><a class="jobs-download" href="data/jobs.csv" download>Download CSV</a></div>
        <div class="jobs-filters" aria-label="Job filters"><input id="jobs-search" type="search" placeholder="Search title, organization, position, or location" aria-label="Search jobs"><select id="jobs-sector" aria-label="Sector"><option value="">All sectors</option><option value="Academia">Academia</option><option value="Industry">Industry</option></select><select id="jobs-sort" aria-label="Sort jobs"><option value="posted">Newest posted</option><option value="first_seen">Newest discovered</option><option value="deadline">Deadline soonest</option><option value="organization">Organization</option></select></div>
        <p id="jobs-status" role="status"></p><div class="jobs-results-bar"><p id="jobs-count"></p><span class="quiet">Current postings</span></div><div id="jobs-list"></div>
      </section>
      <footer>Hosted independently on GitHub Pages · <a href="https://websites.umich.edu/~juanest/">Return to Juan Estrada’s main website</a></footer>
    </main>
    <script src="data/jobs.js"></script>
    <script src="scripts/jobs.js"></script>
  </body>
</html>
